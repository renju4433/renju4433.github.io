name: Update Bisai Schedule JSON

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "bisai/_engine/generate.py"
      - "bisai/_engine/chess_predictor/**"
      - "bisai/_engine/requirements.txt"
      - ".github/workflows/update-bisai.yml"

permissions:
  contents: write

concurrency:
  group: update-bisai-json
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "bisai/_engine/requirements.txt"

      - name: Install dependencies
        run: pip install -r bisai/_engine/requirements.txt

      - name: Sync SQLite DB, lock predictions, simulate Round-Robin, and export JSONs
        run: python bisai/_engine/generate.py --model bisai/_engine/chess_prematch.joblib --db bisai/_engine/history/chess.db --out bisai/data/chess.json --rr-out bisai/data/chess_rr.json --limit 16

      - name: Commit updated DB, model, and JSONs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bisai/data/chess.json bisai/data/chess_rr.json bisai/_engine/chess_prematch.joblib
          if [ -f bisai/_engine/history/chess.db ]; then
            git add bisai/_engine/history/chess.db
          fi
          if git diff --cached --quiet; then
            echo "No schedule, DB, or RR changes."
          else
            git commit -m "chore(bisai): sync DB, locked predictions, and RR standings"
            git push
          fi
