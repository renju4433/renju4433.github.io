name: Renju Tournament & Prediction API

on:
  schedule:
    - cron: "*/30 * * * *"
  repository_dispatch:
    types: [predict, apply, sync]
  workflow_dispatch:
    inputs:
      action:
        description: "操作类型: sync / predict / apply"
        required: false
        default: "sync"
      tid:
        description: "赛事 id，如 2026-shanhai"
        required: false
        default: "2026-shanhai"
      round:
        description: "轮次"
        required: false
        default: "1"
      results:
        description: "赛果，如 1=B,2=W,5=-（- 为清空）"
        required: false
        default: ""
      payload:
        description: "predict 模式的 JSON 请求体"
        required: false
        default: ""
  push:
    branches: ["main"]
    paths:
      - "data/**"
      - "model/**"
      - "tools/**"
      - ".github/workflows/api.yml"

permissions:
  contents: write

concurrency:
  group: renju-api-sync
  cancel-in-progress: true

jobs:
  run-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run requested API action
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_TID: ${{ inputs.tid }}
          INPUT_ROUND: ${{ inputs.round }}
          INPUT_RESULTS: ${{ inputs.results }}
          INPUT_PAYLOAD: ${{ inputs.payload }}
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python - << 'PY'
          import json, os, subprocess

          ev = os.environ.get('EVENT_NAME', '')
          act = os.environ.get('INPUT_ACTION', 'sync')
          if ev == 'repository_dispatch':
              act = os.environ.get('EVENT_ACTION', 'sync')

          if act == 'predict':
              raw = os.environ.get('INPUT_PAYLOAD') or os.environ.get('DISPATCH_PAYLOAD') or '{}'
              with open('/tmp/predict_req.json', 'w', encoding='utf-8') as f:
                  f.write(raw)
              subprocess.check_call(['python', 'tools/predict_api.py', '--predict-json', '/tmp/predict_req.json'])
          elif act == 'apply':
              cp = json.loads(os.environ.get('DISPATCH_PAYLOAD') or '{}') if ev == 'repository_dispatch' else {}
              tid = cp.get('tid') or os.environ.get('INPUT_TID', '2026-shanhai')
              rnd = str(cp.get('round') or os.environ.get('INPUT_ROUND', '1'))
              res = cp.get('results') or os.environ.get('INPUT_RESULTS', '')
              if res:
                  subprocess.check_call(['python', 'tools/manage_duiju.py', 'apply', '--tid', tid, '--round', rnd, '--results', res])
              subprocess.check_call(['python', 'tools/manage_duiju.py', 'sync'])
          else:
              subprocess.check_call(['python', 'tools/manage_duiju.py', 'sync'])
          PY

      - name: Commit updated DB and API JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/duiju.db api/
          if git diff --cached --quiet; then
            echo "No changes in duiju.db or api/."
          else
            git commit -m "chore(api): update tournament data and predictions"
            git push
          fi
