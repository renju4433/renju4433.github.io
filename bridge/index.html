<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            background-color: #dfdfdf;
            margin: 10px;
            font-family: sans-serif;
        }

        .nav-header {
            background-color: #2c3e50;
            color: white;
            padding: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            margin: -10px -10px 15px -10px;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-item {
            padding: 15px 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s, color 0.3s;
            text-decoration: none;
            color: #aab7c4;
            border-bottom: 3px solid transparent;
        }

        .nav-item:hover {
            background-color: #34495e;
            color: white;
        }

        .nav-item.active {
            color: #3498db;
            background-color: #1a252f;
            border-bottom: 3px solid #3498db;
        }

        input[type="text"] {
            width: 100%;
            max-width: 300px;
            padding: 5px;
            box-sizing: border-box;
            margin-bottom: 5px;
        }

        select {
            padding: 5px;
            height: 32px;
            box-sizing: border-box;
            margin-bottom: 5px;
        }

        .flex-row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            flex-wrap: wrap;
            gap: 5px;
        }

        .card {
            display: inline-block;
            padding: 2px 4px;
            margin: 1px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-weight: bold;
        }

        .suit-s {
            color: black;
        }

        .suit-h {
            color: red;
        }

        .suit-d {
            color: red;
        }

        .suit-c {
            color: black;
        }

        @media (max-width: 600px) {
            .card {
                font-size: 0.9em;
            }
        }
    </style>
</head>

<body>
    <div class="nav-header">
        <div class="nav-menu">
            <a href="../mahjong/index.html" class="nav-item">立直麻将牌理机</a>
            <a href="index.html" class="nav-item active">桥牌双明手分析</a>
        </div>
    </div>
    
    <div style="margin-top: 10px; max-width: 350px;">
        <div class="flex-row">
            <span style="width: 30px;">北:</span>
            <input type="text" id="handN">
        </div>
        <div class="flex-row">
            <span style="width: 30px;">东:</span>
            <input type="text" id="handE">
        </div>
        <div class="flex-row">
            <span style="width: 30px;">南:</span>
            <input type="text" id="handS">
        </div>
        <div class="flex-row">
            <span style="width: 30px;">西:</span>
            <input type="text" id="handW">
        </div>

        <div class="flex-row">
            <select id="trump">
                <option value="4">无将</option>
                <option value="0">黑桃</option>
                <option value="1">红心</option>
                <option value="2">方块</option>
                <option value="3">草花</option>
            </select>
            <select id="leader">
                <option value="0">北首攻</option>
                <option value="1">东首攻</option>
                <option value="2">南首攻</option>
                <option value="3">西首攻</option>
            </select>
        </div>
    </div>
    <button onclick="myFunction()" style="margin-top: 5px;">分析</button>
    <div id="handDisplay" style="margin-top:10px; margin-bottom:10px; min-height: 65px; max-width: 350px;"></div>
    <span id="result"></span>
    <script src="bridge.js"></script>
    <script>
        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var hasParams = false;
            
            if (urlParams.has('n')) { document.getElementById('handN').value = urlParams.get('n').replace(/_/g, ' '); hasParams = true; }
            if (urlParams.has('e')) { document.getElementById('handE').value = urlParams.get('e').replace(/_/g, ' '); hasParams = true; }
            if (urlParams.has('s')) { document.getElementById('handS').value = urlParams.get('s').replace(/_/g, ' '); hasParams = true; }
            if (urlParams.has('w')) { document.getElementById('handW').value = urlParams.get('w').replace(/_/g, ' '); hasParams = true; }
            if (urlParams.has('t')) { document.getElementById('trump').value = urlParams.get('t'); }
            if (urlParams.has('l')) { document.getElementById('leader').value = urlParams.get('l'); }
            
            // 绑定事件监听器
            var inputs = ['handN', 'handE', 'handS', 'handW'];
            inputs.forEach(function(id) {
                document.getElementById(id).addEventListener('input', function() {
                    document.getElementById("result").innerHTML = ""; // 清空计算结果
                    updateView();
                });
            });
            var selects = ['trump', 'leader'];
            selects.forEach(function(id) {
                document.getElementById(id).addEventListener('change', function() {
                    document.getElementById("result").innerHTML = ""; // 清空计算结果
                    updateView();
                });
            });

            updateView();
        };

        function updateView() {
            var handStrs = [
                document.getElementById("handN").value,
                document.getElementById("handE").value,
                document.getElementById("handS").value,
                document.getElementById("handW").value
            ];
            var trump = parseInt(document.getElementById("trump").value);
            var leader = parseInt(document.getElementById("leader").value);

            // Update URL with current state
            var url = new URL(window.location);
            if (handStrs[0]) url.searchParams.set('n', handStrs[0].replace(/ /g, '_')); else url.searchParams.delete('n');
            if (handStrs[1]) url.searchParams.set('e', handStrs[1].replace(/ /g, '_')); else url.searchParams.delete('e');
            if (handStrs[2]) url.searchParams.set('s', handStrs[2].replace(/ /g, '_')); else url.searchParams.delete('s');
            if (handStrs[3]) url.searchParams.set('w', handStrs[3].replace(/ /g, '_')); else url.searchParams.delete('w');
            url.searchParams.set('t', trump);
            url.searchParams.set('l', leader);
            window.history.replaceState({}, '', url);

            try {
                var parsed = parseHands(handStrs);
                document.getElementById("handDisplay").innerHTML = displayHands(parsed);
                return parsed;
            } catch (e) {
                document.getElementById("handDisplay").innerHTML = "";
                return null;
            }
        }

        function formatCard(suit, rank) {
            var suitChars = ['S', 'H', 'D', 'C'];
            var ranks = "23456789TJQKA";
            var rChar = ranks[rank];
            var rStr = (rChar === 'T') ? '10' : rChar;
            var sChar = suitChars[suit];
            var key = rStr + sChar;
            var url = 'cards/' + key + '.png';
            return '<img src="' + url + '" alt="' + key + '" style="width: 50px; margin-right: -40px; box-shadow: 1px 1px 3px rgba(0,0,0,0.3); border-radius: 3px; position: relative; background-color: white;">';
        }

        function displayHands(hands) {
            var html = "";
            var players = ["北", "东", "南", "西"];
            for (var p = 0; p < 4; p++) {
                html += "<div class='flex-row' style='margin-bottom: 8px;'><b style='width: 30px;'>" + players[p] + ":</b><div style='display: flex;'>";
                for (var s = 0; s < 4; s++) {
                    var mask = hands[p][s];
                    var suitHtml = "";
                    for (var r = 12; r >= 0; r--) {
                        if ((mask & (1 << r)) !== 0) {
                            suitHtml += formatCard(s, r);
                        }
                    }
                    if (suitHtml !== "") {
                        html += "<div style='margin-right: 5px; display: flex;'>" + suitHtml + "</div>";
                    }
                }
                html += "</div></div>";
            }
            return html;
        }

        function myFunction() {
            var t0 = performance.now();
            var parsed = updateView();
            if (!parsed) return;

            var trump = parseInt(document.getElementById("trump").value);
            var leader = parseInt(document.getElementById("leader").value);

            document.getElementById("result").innerHTML = "计算中...";

            // Use setTimeout to allow UI to update before heavy computation
            setTimeout(function() {
                try {
                    var res = solveDDS(parsed, trump, leader);
                    var t1 = performance.now();

                    var out = "南北 " + res.ns + " 墩 东西 " + res.ew + " 墩 <span style='color: #888; font-size: 0.9em;'>(耗时 " + (t1 - t0).toFixed(1) + " ms, 节点数 " + res.nodes + ")</span>";
                    document.getElementById("result").innerHTML = out;
                } catch (e) {
                    document.getElementById("result").innerHTML = "<span style='color:red;'>错误: " + e.message + "</span>";
                }
            }, 0);
        }
    </script>
</body>

</html>
