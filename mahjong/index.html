<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
body {
  background-color: #dfdfdf;
  margin: 10px;
  font-family: sans-serif;
}
input[type="text"] {
  width: 100%;
  max-width: 300px;
  padding: 5px;
  box-sizing: border-box;
}
.mj-tile {
  display: inline-block;
  width: 40px;
  height: 64.5px;
  background-image: url('./mjui.png');
  background-size: 400px 258px;
  vertical-align: middle;
}
.flex-row {
  display: flex;
  align-items: center;
  margin-bottom: 5px;
  flex-wrap: wrap;
}
@media (max-width: 600px) {
  .mj-tile {
    width: 30px;
    height: 48.375px;
    background-size: 300px 193.5px;
  }
}
</style>
</head>
<body>
立直麻将牌理机<br>
<div style="display: flex; align-items: center; gap: 5px; max-width: 300px;">
  <input type="text" name="hand" id="hand" style="flex: 1;">
  <select id="handType" style="padding: 5px; height: 32px; box-sizing: border-box;">
    <option value="all">一般型</option>
    <option value="standard">标准型</option>
  </select>
</div>
<button onclick="myFunction()" style="margin-top: 5px;">分析</button>
<div id="handDisplay" style="margin-top:10px; margin-bottom:10px; min-height: 65px;"></div>
<span id="result"></span>
<script src="mahjong.js"></script>
<script>
fetch('table.json')
  .then(response => response.json())
  .then(data => {
    initTable(data);
  })
  .catch(error => {
    document.getElementById("result").innerHTML = "<span style='color:red;'>加载失败: " + error.message + "</span>";
  });

function formatTile(idx, extraStyle, isAka) {
  var suit = Math.floor(idx / 9) == 3 ? 3 : (Math.floor(idx / 9) + 1) % 3;
  var val = idx % 9;
  if (isAka) {
    val = 9;
  }
  var isMobile = window.innerWidth <= 600;
  var w = isMobile ? 30 : 40;
  var h = isMobile ? 48.375 : 64.5;
  var x = -(val * w);
  var y = -(suit * h);
  var styleStr = 'background-position: ' + x + 'px ' + y + 'px;';
  if (extraStyle) styleStr += ' ' + extraStyle;
  return '<span class="mj-tile" style="' + styleStr + '"></span>';
}

function myFunction() {
  var t0 = performance.now();
  var inputStr = document.getElementById("hand").value.toLowerCase();
  var handType = document.getElementById("handType").value;
  var parsed = parseHand(inputStr);
  var counts = parsed.counts;
  var count = parsed.count;
  var tiles = parsed.tiles;
  var akas = parsed.akas;
  var out = "";
  var handDisplay = document.getElementById("handDisplay");
  handDisplay.innerHTML = "";

  var handHtml = "";
  if (tiles.length > 0) {
    var firstTiles = tiles.slice(0, tiles.length - 1);
    firstTiles.sort(function(a, b) { 
      if (a.t === b.t) return a.isAka ? -1 : 1;
      return a.t - b.t; 
    });
    var displayTiles = firstTiles.concat([tiles[tiles.length - 1]]);
    for(var k=0; k<displayTiles.length; k++) {
      var extraStyle = (k === displayTiles.length - 1 && displayTiles.length > 1) ? 'margin-left: 8px;' : '';
      handHtml += formatTile(displayTiles[k].t, extraStyle, displayTiles[k].isAka);
    }
  }
  handDisplay.innerHTML = handHtml;

  if (count === 0 || count > 14 || (count % 3 !== 1 && count % 3 !== 2)) {
    document.getElementById("result").innerHTML = "请输入最多14张的3n+1或3n+2张有效牌。";
    return;
  }
  
  for (var i = 0; i < 34; i++) {
    if (counts[i] > 4) {
      document.getElementById("result").innerHTML = "<div class='flex-row'>" + formatTile(i, '', false) + " <span style='margin-left:5px;'>超过4张。</span></div>";
      return;
    }
  }

  if (count % 3 === 1) {
    var s = getShanten(counts, count, handType);
    var uk = [];
    var ukc = 0;
    for (var i = 0; i < 34; i++) {
      if (counts[i] < 4) {
        counts[i]++;
        if (getShanten(counts, count + 1, handType) < s) {
          uk.push(formatTile(i, '', false));
          ukc += (4 - (counts[i] - 1));
        }
        counts[i]--;
      }
    }
    out = (s === 0 ? "听牌" : s + " 向听");
    var t1 = performance.now();
    out += " <span style='color: #888; font-size: 0.9em;'>(耗时 " + (t1 - t0).toFixed(1) + " ms)</span><br>";
    if (uk.length > 0) {
      out += "<div class='flex-row'><span style='flex-shrink:0;'>进张</span>" + uk.join("") + " <span style='margin-left:10px; flex-shrink:0;'>(共 " + ukc + " 枚)</span></div>";
    } else {
      out += "无进张";
    }
  } else {
    var isAgari = getShanten(counts, count, handType) === -1;
    if (isAgari) {
      document.getElementById("result").innerHTML = "和牌";
      return;
    }
    
    var min_s = 8;
    var discards = [];
    
    for (var i = 0; i < 34; i++) {
      if (counts[i] > 0) {
        counts[i]--;
        var s = getShanten(counts, count - 1, handType);
        if (s <= min_s) {
          if (s < min_s) {
            min_s = s;
            discards = [];
          }
          var uk = [];
          var ukc = 0;
          for (var j = 0; j < 34; j++) {
            if (counts[j] < 4) {
              counts[j]++;
              if (getShanten(counts, count, handType) < s) {
                uk.push(formatTile(j, '', false));
                var orig = counts[j] - 1 + (j === i ? 1 : 0);
                ukc += (4 - orig);
              }
              counts[j]--;
            }
          }
          if (uk.length > 0) {
            var hasAkaInHand = (akas[i] && akas[i] > 0);
            var isDiscardingAka = hasAkaInHand && (counts[i] === 0 || akas[i] > counts[i]);
            discards.push({ tile: i, isAka: isDiscardingAka, ukeire: uk.join(""), ukeireCount: ukc, s: s });
          }
        }
        counts[i]++;
      }
    }
    
    discards.sort(function(a, b) { return b.ukeireCount - a.ukeireCount; });
    
    out = (min_s === 0 ? "听牌" : min_s + " 向听");
    var t1 = performance.now();
    out += " <span style='color: #888; font-size: 0.9em;'>(耗时 " + (t1 - t0).toFixed(1) + " ms)</span><br><br>";
    if (discards.length > 0) {
      for (var d = 0; d < discards.length; d++) {
        out += "<div class='flex-row'>";
        out += "<span style='margin-right:10px; flex-shrink: 0;'>打</span>" + formatTile(discards[d].tile, '', discards[d].isAka);
        out += "<span style='margin-left:20px; margin-right:10px; flex-shrink: 0;'>进张</span>" + discards[d].ukeire;
        out += "<span style='margin-left:10px; flex-shrink: 0;'>(共 " + discards[d].ukeireCount + " 枚)</span>";
        out += "</div>";
      }
    } else {
      out += "无有效打牌";
    }
  }
  
  document.getElementById("result").innerHTML = out;
}
</script>
</body>
</html>
