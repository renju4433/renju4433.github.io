<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
body {
  background-color: #dfdfdf;
  margin: 10px;
  font-family: sans-serif;
}
input[type="text"] {
  width: 100%;
  max-width: 300px;
  padding: 5px;
  box-sizing: border-box;
}
.mj-tile {
  display: inline-block;
  width: 40px;
  height: 64.5px;
  background-image: url('./mjui.png');
  background-size: 400px 258px;
  vertical-align: middle;
}
.flex-row {
  display: flex;
  align-items: center;
  margin-bottom: 5px;
  flex-wrap: wrap;
}
@media (max-width: 600px) {
  .mj-tile {
    width: 30px;
    height: 48.375px;
    background-size: 300px 193.5px;
  }
}
</style>
</head>
<body>
立直麻将牌理机<br>
<input type="text" name="hand" id="hand">
<br><button onclick="myFunction()" style="margin-top: 5px;">分析</button>
<div id="handDisplay" style="margin-top:10px; margin-bottom:10px; min-height: 65px;"></div>
<span id="result"></span>
<script>
window.addEventListener('resize', function() {
  if (document.getElementById("hand").value) {
    myFunction();
  }
});

function formatTile(idx, extraStyle, isAka) {
  var suit = Math.floor(idx / 9) == 3 ? 3 : (Math.floor(idx / 9) + 1) % 3;
  var val = idx % 9;
  if (isAka) {
    val = 9;
  }
  var isMobile = window.innerWidth <= 600;
  var w = isMobile ? 30 : 40;
  var h = isMobile ? 48.375 : 64.5;
  var x = -(val * w);
  var y = -(suit * h);
  var styleStr = 'background-position: ' + x + 'px ' + y + 'px;';
  if (extraStyle) styleStr += ' ' + extraStyle;
  return '<span class="mj-tile" style="' + styleStr + '"></span>';
}

function parseHand(str) {
  var counts = new Array(34);
  for(var i=0; i<34; i++) counts[i] = 0;
  var nums = [];
  var count = 0;
  var tiles = [];
  var akas = {};
  for (var i = 0; i < str.length; i++) {
    var c = str[i];
    if (c >= '0' && c <= '9') {
      nums.push(c === '0' ? 4 : parseInt(c) - 1);
    } else {
      var offset = -1;
      if (c === 'm') offset = 0;
      else if (c === 'p') offset = 9;
      else if (c === 's') offset = 18;
      else if (c === 'z') offset = 27;
      
      if (offset !== -1) {
        for (var j = 0; j < nums.length; j++) {
          if (offset === 27 && nums[j] > 6) continue;
          var t = offset + nums[j];
          counts[t]++;
          count++;
          
          var isAka = false;
          if (offset !== 27 && nums[j] === 4 && str[i - nums.length + j] === '0') {
            isAka = true;
            akas[t] = (akas[t] || 0) + 1;
          }
          tiles.push({ t: t, isAka: isAka });
        }
        nums = [];
      }
    }
  }
  return { counts: counts, count: count, tiles: tiles, akas: akas };
}

function getShanten(counts) {
  var minS = 8;
  var kCount = 0, kPair = 0;
  var kTiles = [0,8,9,17,18,26,27,28,29,30,31,32,33];
  for (var i = 0; i < kTiles.length; i++) {
    if (counts[kTiles[i]] > 0) {
      kCount++;
      if (counts[kTiles[i]] > 1) kPair = 1;
    }
  }
  minS = Math.min(minS, 13 - kCount - kPair);
  
  var pairs = 0, kinds = 0;
  for (var i = 0; i < 34; i++) {
    if (counts[i] > 0) kinds++;
    if (counts[i] >= 2) pairs++;
  }
  minS = Math.min(minS, 6 - pairs + Math.max(0, 7 - kinds));
  
  function dfs(d, melds, blocks, pair) {
    while(d < 34 && counts[d] === 0) d++;
    if (d >= 34) {
      var b = blocks;
      if (melds + b > 4) b = 4 - melds;
      var s = 8 - 2 * melds - b - pair;
      if (s < minS) minS = s;
      return;
    }
    
    var c = counts[d];
    if (c >= 3) { counts[d]-=3; dfs(d, melds+1, blocks, pair); counts[d]+=3; }
    if (c >= 2 && !pair) { counts[d]-=2; dfs(d, melds, blocks, 1); counts[d]+=2; }
    if (d < 27 && d % 9 < 7 && counts[d]>0 && counts[d+1]>0 && counts[d+2]>0) {
      counts[d]--; counts[d+1]--; counts[d+2]--; dfs(d, melds+1, blocks, pair); counts[d]++; counts[d+1]++; counts[d+2]++;
    }
    if (melds + blocks < 4) {
      if (c >= 2) { counts[d]-=2; dfs(d, melds, blocks+1, pair); counts[d]+=2; }
      if (d < 27 && d % 9 < 8 && counts[d]>0 && counts[d+1]>0) {
        counts[d]--; counts[d+1]--; dfs(d, melds, blocks+1, pair); counts[d]++; counts[d+1]++;
      }
      if (d < 27 && d % 9 < 7 && counts[d]>0 && counts[d+2]>0) {
        counts[d]--; counts[d+2]--; dfs(d, melds, blocks+1, pair); counts[d]++; counts[d+2]++;
      }
    }
    dfs(d + 1, melds, blocks, pair);
  }
  
  dfs(0, 0, 0, 0);
  return minS;
}

function myFunction() {
  var inputStr = document.getElementById("hand").value.toLowerCase();
  var parsed = parseHand(inputStr);
  var counts = parsed.counts;
  var count = parsed.count;
  var tiles = parsed.tiles;
  var akas = parsed.akas;
  var out = "";
  var handDisplay = document.getElementById("handDisplay");
  handDisplay.innerHTML = "";

  var handHtml = "";
  if (tiles.length > 0) {
    var firstTiles = tiles.slice(0, tiles.length - 1);
    firstTiles.sort(function(a, b) { 
      if (a.t === b.t) return a.isAka ? -1 : 1;
      return a.t - b.t; 
    });
    var displayTiles = firstTiles.concat([tiles[tiles.length - 1]]);
    for(var k=0; k<displayTiles.length; k++) {
      var extraStyle = (k === displayTiles.length - 1 && displayTiles.length > 1) ? 'margin-left: 8px;' : '';
      handHtml += formatTile(displayTiles[k].t, extraStyle, displayTiles[k].isAka);
    }
  }
  handDisplay.innerHTML = handHtml;

  if (count !== 13 && count !== 14) {
    document.getElementById("result").innerHTML = "请输入13或14张有效牌。";
    return;
  }
  
  for (var i = 0; i < 34; i++) {
    if (counts[i] > 4) {
      document.getElementById("result").innerHTML = "<div class='flex-row'>" + formatTile(i, '', false) + " <span style='margin-left:5px;'>超过4张！</span></div>";
      return;
    }
  }

  if (count === 13) {
    var s = getShanten(counts);
    var uk = [];
    var ukc = 0;
    for (var i = 0; i < 34; i++) {
      if (counts[i] < 4) {
        counts[i]++;
        if (getShanten(counts) < s) {
          uk.push(formatTile(i, '', false));
          ukc += (4 - (counts[i] - 1));
        }
        counts[i]--;
      }
    }
    out = (s === 0 ? "听牌" : s + " 向听") + "<br>";
    if (uk.length > 0) {
      out += "<div class='flex-row'><span style='flex-shrink:0;'>进张：</span>" + uk.join("") + " <span style='margin-left:10px; flex-shrink:0;'>(共 " + ukc + " 枚)</span></div>";
    } else {
      out += "无进张";
    }
  } else {
    var isAgari = getShanten(counts) === -1;
    if (isAgari) {
      document.getElementById("result").innerHTML = "和牌";
      return;
    }
    
    var min_s = 8;
    var discards = [];
    
    for (var i = 0; i < 34; i++) {
      if (counts[i] > 0) {
        counts[i]--;
        var s = getShanten(counts);
        if (s <= min_s) {
          if (s < min_s) {
            min_s = s;
            discards = [];
          }
          var uk = [];
          var ukc = 0;
          for (var j = 0; j < 34; j++) {
            if (counts[j] < 4) {
              counts[j]++;
              if (getShanten(counts) < s) {
                uk.push(formatTile(j, '', false));
                var orig = counts[j] - 1 + (j === i ? 1 : 0);
                ukc += (4 - orig);
              }
              counts[j]--;
            }
          }
          if (uk.length > 0) {
            var hasAkaInHand = (akas[i] && akas[i] > 0);
            var isDiscardingAka = hasAkaInHand && (counts[i] === 0 || akas[i] > counts[i]);
            discards.push({ tile: i, isAka: isDiscardingAka, ukeire: uk.join(""), ukeireCount: ukc, s: s });
          }
        }
        counts[i]++;
      }
    }
    
    discards.sort(function(a, b) { return b.ukeireCount - a.ukeireCount; });
    
    out = "当前状态：" + (min_s === 0 ? "听牌" : min_s + " 向听") + "<br><br>";
    if (discards.length > 0) {
      for (var d = 0; d < discards.length; d++) {
        out += "<div class='flex-row'>";
        out += "<span style='margin-right:10px; flex-shrink: 0;'>打</span>" + formatTile(discards[d].tile, '', discards[d].isAka);
        out += "<span style='margin-left:20px; margin-right:10px; flex-shrink: 0;'>进张:</span>" + discards[d].ukeire;
        out += "<span style='margin-left:10px; flex-shrink: 0;'>(共 " + discards[d].ukeireCount + " 枚)</span>";
        out += "</div>";
      }
    } else {
      out += "无有效打牌";
    }
  }
  
  document.getElementById("result").innerHTML = out;
}
</script>
</body>
</html>
