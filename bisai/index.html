<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bisai</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f8fafc;
    --pill: #f1f5f9;
    --line: #e5e7eb;
    --text: #0f172a;
    --muted: #64748b;
    --blue: #1d4ed8;
    --green: #16a34a;
    --slate: #475569;
    --red: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Top Header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255, 255, 255, .97);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .hdr-in { max-width: 1120px; margin: 0 auto; padding: 10px 20px 0; }
  .hdr-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding-bottom: 8px;
  }
  .brand {
    font-size: 18px; font-weight: 700; letter-spacing: -.02em;
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .brand i { color: var(--blue); font-style: normal; }
  .hdr-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    appearance: none; border: 0; background: transparent; color: var(--text);
    width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: var(--pill); }
  .search-input {
    display: none; width: 220px; max-width: 50vw;
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px;
    color: var(--text); outline: none;
  }
  .search-input.open { display: block; }
  .search-input:focus { border-color: var(--blue); background: #fff; }

  .nav-tabs {
    display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .nav-tabs button {
    appearance: none; border: 0; background: none;
    padding: 8px 2px 10px; font: inherit; font-size: 14px; font-weight: 500;
    color: var(--muted); cursor: pointer; white-space: nowrap;
    border-bottom: 2px solid transparent; transition: .15s;
  }
  .nav-tabs button.on {
    color: var(--text); font-weight: 600; border-bottom-color: var(--text);
  }

  /* ---------- Main 2-Column Shell ---------- */
  .shell {
    max-width: 1120px; margin: 0 auto; padding: 20px 20px 64px;
    display: grid; grid-template-columns: minmax(0, 1fr) 320px;
    gap: 30px; align-items: start;
  }

  /* ---------- Centered Segmented Toggle ---------- */
  .seg-center {
    display: flex; justify-content: center; margin-bottom: 20px;
  }
  .seg {
    display: inline-flex; background: var(--pill); padding: 3px; border-radius: 999px;
  }
  .seg button {
    appearance: none; border: 0; background: transparent;
    padding: 5px 18px; border-radius: 999px; font: inherit; font-size: 13px;
    font-weight: 500; color: var(--muted); cursor: pointer; transition: .15s;
  }
  .seg button.on {
    background: #fff; color: var(--text); font-weight: 600;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .08);
  }

  .filter-pill-bar {
    display: none; align-items: center; gap: 8px; margin-bottom: 14px;
  }
  .filter-pill-bar.on { display: flex; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--pill); padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .filter-chip button {
    appearance: none; border: 0; background: none; cursor: pointer;
    color: var(--muted); font-size: 14px; padding: 0; line-height: 1;
  }

  .sec-title {
    font-size: 15px; font-weight: 700; margin: 20px 0 10px; color: var(--text);
  }
  .sec-title:first-child { margin-top: 0; }

  /* ---------- Featured 3-Card Grid ---------- */
  .feat-grid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px; margin-bottom: 22px;
  }
  .fcard {
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
    padding: 10px 12px; cursor: pointer; transition: border-color .15s;
  }
  .fcard:hover { border-color: #cbd5e1; }
  .fcard .fmeta {
    font-size: 11px; color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px;
  }
  .fcard .frow {
    display: flex; align-items: center; justify-content: space-between;
    gap: 6px; margin-top: 5px;
  }
  .fcard .fn {
    font-size: 13px; font-weight: 500; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .fcard .fn.win { font-weight: 700; }

  /* ---------- Most Confident Compact List ---------- */
  .conf-list { margin-bottom: 18px; }
  .conf-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--line);
    cursor: pointer; font-size: 14px;
  }
  .conf-row:hover { background: var(--surface); }
  .conf-names {
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .conf-names b { font-weight: 700; }
  .conf-right {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .conf-meta { font-size: 12px; color: var(--muted); }

  /* ---------- Probability Badges ---------- */
  .badge {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 2px 7px; border-radius: 5px; font-size: 12px; font-weight: 700;
    line-height: 1.3; white-space: nowrap;
  }
  .badge.hi { background: var(--green); color: #fff; }
  .badge.mid { background: var(--slate); color: #fff; }
  .badge.lo { background: transparent; color: var(--muted); padding: 2px 0; font-weight: 500; }

  /* ---------- Date Divider ---------- */
  .day-div {
    display: flex; align-items: center; gap: 12px;
    margin: 20px 0 4px; color: var(--muted); font-size: 13px; font-weight: 600;
  }
  .day-div::before, .day-div::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }

  /* ---------- Match Cards (exact sport.dev 3-col layout) ---------- */
  .mcard {
    border-bottom: 1px solid var(--line); padding: 13px 2px; cursor: pointer;
  }
  .mcard:hover { background: var(--surface); }
  .mcard .mtop {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--muted); margin-bottom: 8px;
  }
  .mcard .mgrid {
    display: grid; grid-template-columns: minmax(0, 1fr) 104px minmax(0, 1fr);
    align-items: center; gap: 10px;
  }
  .side { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .side.right { align-items: flex-end; text-align: right; }
  .pname {
    display: flex; align-items: center; gap: 6px; max-width: 100%;
    font-size: 15px; font-weight: 600;
  }
  .side.right .pname { flex-direction: row-reverse; }
  .pname span.txt {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .elo-tag {
    font-size: 11px; font-weight: 500; color: var(--muted);
    background: var(--pill); padding: 1px 5px; border-radius: 4px; flex-shrink: 0;
  }
  .center-box { text-align: center; }
  .center-box .main-val {
    font-size: 16px; font-weight: 700; color: var(--text); white-space: nowrap;
  }

  .mdetail {
    margin-top: 10px; padding: 10px 12px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .pbar-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
  .pbar {
    flex: 1; height: 6px; border-radius: 999px; background: var(--line);
    display: flex; overflow: hidden;
  }
  .pbar i { display: block; height: 100%; }
  .pbar .pw { background: var(--blue); }
  .pbar .pd { background: #cbd5e1; }
  .pbar .pb { background: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
  .chips b { color: var(--text); font-weight: 600; margin-left: 4px; }

  .more-wrap { display: flex; justify-content: center; margin-top: 20px; }
  .more-btn {
    appearance: none; background: #fff; border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 32px; font: inherit; font-size: 14px;
    font-weight: 600; color: var(--text); cursor: pointer;
  }
  .more-btn:hover { background: var(--surface); }

  /* ---------- Championship Leaderboard ---------- */
  .tour-pills {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px;
  }
  .tour-pills button {
    appearance: none; border: 1px solid var(--line); background: #fff;
    padding: 5px 12px; border-radius: 999px; font: inherit; font-size: 12px;
    color: var(--muted); cursor: pointer;
  }
  .tour-pills button.on {
    background: var(--text); color: #fff; border-color: var(--text); font-weight: 600;
  }
  .rr-card {
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
    overflow: hidden; margin-bottom: 16px;
  }
  .rr-head, .rr-row {
    display: grid; grid-template-columns: 32px minmax(0, 1fr) 54px 52px 66px 56px 58px;
    gap: 8px; padding: 10px 14px; align-items: center;
  }
  .rr-head {
    background: var(--surface); border-bottom: 1px solid var(--line);
    font-size: 11px; color: var(--muted); font-weight: 600;
  }
  .rr-head span:nth-child(n+3), .rr-row span:nth-child(n+3) { text-align: right; }
  .rr-row {
    border-bottom: 1px solid var(--line); cursor: pointer; font-size: 14px;
  }
  .rr-row:last-child { border-bottom: 0; }
  .rr-row:hover, .rr-row.sel { background: var(--surface); }
  .rr-row .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rr-panel {
    padding: 12px 16px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .dist {
    display: flex; align-items: flex-end; gap: 6px; height: 68px; margin-top: 10px;
  }
  .dist .col {
    flex: 1; max-width: 40px; display: flex; flex-direction: column;
    align-items: center; gap: 4px; height: 100%;
  }
  .dist .bar { flex: 1; width: 100%; display: flex; align-items: flex-end; }
  .dist .bar i {
    display: block; width: 100%; border-radius: 3px 3px 0 0; background: var(--blue); opacity: .25;
  }
  .dist .col.hot .bar i { opacity: .9; }
  .dist .k { font-size: 11px; color: var(--muted); }

  /* ---------- Right Sidebar ---------- */
  aside { display: flex; flex-direction: column; gap: 16px; }
  .stat-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-box {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px;
  }
  .stat-box .lbl { font-size: 12px; color: var(--muted); }
  .stat-box .big { font-size: 26px; font-weight: 700; margin: 2px 0; }
  .stat-box .sub { font-size: 11px; color: var(--muted); }

  .side-block h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
  .side-item { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .side-item:last-child { border-bottom: 0; }
  .side-match {
    display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    gap: 6px; align-items: center; font-weight: 600;
  }
  .side-match span:first-child, .side-match span:last-child {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .side-match span:last-child { text-align: right; }
  .side-sub {
    font-size: 11px; color: var(--muted); margin-top: 2px;
    display: flex; justify-content: space-between; gap: 6px;
  }

  .side-card {
    background: #fff; border: 1px solid var(--line);
    border-radius: 10px; padding: 14px;
  }
  .side-card h3 { font-size: 14px; font-weight: 700; margin: 0 0 10px; }
  .league-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px;
  }
  .league-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 6px; font-size: 12px; padding: 4px 0; cursor: pointer; min-width: 0;
  }
  .league-item:hover { color: var(--blue); }
  .league-item .ln { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .league-item .ld { color: var(--muted); flex-shrink: 0; }

  .empty { padding: 40px 0; text-align: center; color: var(--muted); font-size: 14px; }

  @media (max-width: 880px) {
    .shell { grid-template-columns: 1fr; }
    .feat-grid { grid-template-columns: 1fr; }
    .league-grid { grid-template-columns: 1fr; }
    .rr-head, .rr-row { grid-template-columns: 26px minmax(0, 1fr) 48px 46px 58px 48px 48px; padding: 9px 10px; font-size: 13px; }
  }
</style>
</head>
<body>
<header>
  <div class="hdr-in">
    <div class="hdr-top">
      <div class="brand" id="brandHome"><i>#</i><span>bisai</span></div>
      <div class="hdr-actions">
        <input id="searchBox" class="search-input" type="search" placeholder="搜索棋手 / 赛事" />
        <button class="icon-btn" id="searchToggle" aria-label="搜索">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </div>
    </div>
    <nav class="nav-tabs" id="projectTabs"></nav>
  </div>
</header>

<div class="shell">
  <section id="mainCol">
    <div class="seg-center" id="segWrap">
      <div class="seg" id="viewSeg">
        <button data-sub="schedule" class="on">赛程</button>
        <button data-sub="results">赛果</button>
      </div>
    </div>
    <div class="filter-pill-bar" id="filterPillBar"></div>
    <div id="mainContent"></div>
  </section>

  <aside id="sidebar"></aside>
</div>

<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  const el = {
    brand: $("brandHome"),
    tabs: $("projectTabs"),
    search: $("searchBox"),
    searchBtn: $("searchToggle"),
    segWrap: $("segWrap"),
    viewSeg: $("viewSeg"),
    pillBar: $("filterPillBar"),
    main: $("mainContent"),
    side: $("sidebar"),
  };

  const pct = (v) => (v == null ? "—" : Math.round(v * 100) + "%");
  const pct1 = (v) => (v == null ? "—" : (v * 100).toFixed(1) + "%");
  const num = (v, d = 2) => (v == null ? "—" : Number(v).toFixed(d));
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const isDone = (st) => st === "1-0" || st === "0-1" || st === "1/2-1/2" || st === "½-½";

  function fmtDateTime(ms, iso) {
    const d = ms ? new Date(ms) : (iso ? new Date(String(iso).replace(" UTC", "Z").replace(" ", "T")) : null);
    if (!d || isNaN(d.getTime())) return { day: "—", time: "—", full: "—" };
    const pad = (n) => String(n).padStart(2, "0");
    const day = `${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const time = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    return { day, time, full: `${day} ${time}` };
  }

  function badgeClass(p, oppP) {
    if (p >= 0.58) return "hi";
    if (p >= oppP && p >= 0.35) return "mid";
    return "lo";
  }

  /* ---------------- 可扩展项目注册表 ---------------- */
  const PROJECTS = [
    { id: "chess", label: "国际象棋", type: "matches", dataUrl: "./data/chess.json" },
    { id: "chess_championship", label: "单循环冠军", type: "championship", dataUrl: "./data/chess.json" },
  ];

  let state = {
    project: PROJECTS.find((p) => p.id === qs.get("view") || p.id === qs.get("project")) || PROJECTS[0],
    subView: "schedule", // "schedule" | "results"
    query: "",
    tourId: null,
    tourName: null,
    champTourId: null,
    limitShow: 15,
    openKey: null,
    data: null,
  };

  async function loadData() {
    const bust = Math.floor(Date.now() / 60000);
    const res = await fetch(`${state.project.dataUrl}?v=${bust}`);
    if (!res.ok) throw new Error(res.status);
    state.data = await res.json();
  }

  function renderTabs() {
    el.tabs.innerHTML = "";
    PROJECTS.forEach((p) => {
      const b = document.createElement("button");
      b.textContent = p.label;
      b.className = p.id === state.project.id ? "on" : "";
      b.addEventListener("click", () => {
        if (state.project.id === p.id) return;
        state.project = p;
        state.openKey = null;
        renderTabs();
        renderAll();
      });
      el.tabs.appendChild(b);
    });
  }

  function renderPillBar() {
    if (state.project.type === "matches" && state.tourId) {
      el.pillBar.className = "filter-pill-bar on";
      el.pillBar.innerHTML = `<span class="filter-chip">${esc(state.tourName || state.tourId)} <button id="clearTourFilter">×</button></span>`;
      $("clearTourFilter").addEventListener("click", () => {
        state.tourId = null;
        state.tourName = null;
        state.limitShow = 15;
        renderAll();
      });
    } else {
      el.pillBar.className = "filter-pill-bar";
      el.pillBar.innerHTML = "";
    }
  }

  function renderMatchesView() {
    el.segWrap.style.display = "flex";
    renderPillBar();

    const q = state.query.trim().toLowerCase();
    const events = (state.data && state.data.events) || [];
    const wantFinished = state.subView === "results";
    let rounds = events.filter((ev) => (wantFinished ? ev.status === "finished" : ev.status !== "finished"));
    if (state.tourId) rounds = rounds.filter((r) => r.tour_id === state.tourId);

    const flat = [];
    rounds.forEach((r) => {
      const dt = fmtDateTime(r.starts_at_ms, r.starts_at);
      (r.pairings || []).forEach((g, idx) => {
        if (q) {
          const hay = `${r.tour_name} ${g.white} ${g.black}`.toLowerCase();
          if (!hay.includes(q)) return;
        }
        const pr = g.prediction || {};
        const pw = pr.p_white_win || 0;
        const pb = pr.p_black_win || 0;
        const favP = Math.max(pw, pb);
        const favName = pw >= pb ? g.white : g.black;
        flat.push({
          key: `${r.round_id}::${idx}`,
          round: r,
          game: g,
          dt,
          maxElo: Math.max(g.white_elo || 0, g.black_elo || 0),
          favP,
          favName,
        });
      });
    });

    if (!flat.length) {
      el.main.innerHTML = '<div class="empty">—</div>';
      return;
    }

    let html = "";

    // 1. 焦点赛事（3栏卡片）
    if (!q && !state.tourId && flat.length >= 3) {
      const top3 = flat.slice().sort((a, b) => b.maxElo - a.maxElo).slice(0, 3);
      html += `<div class="sec-title">焦点赛事</div><div class="feat-grid">`;
      top3.forEach((it) => {
        const g = it.game;
        const pr = g.prediction || {};
        const pw = pr.p_white_win || 0;
        const pb = pr.p_black_win || 0;
        const done = isDone(g.status);
        const wWin = done ? g.status === "1-0" : pw >= pb;
        const bWin = done ? g.status === "0-1" : pb > pw;
        html += `
          <div class="fcard" data-jump="${esc(it.key)}">
            <div class="fmeta">${esc(it.round.round_name)} · ${esc(it.round.tour_name)}<br>${esc(it.dt.full)}</div>
            <div class="frow">
              <span class="fn${wWin ? " win" : ""}">${esc(g.white)}</span>
              <span class="badge ${badgeClass(pw, pb)}">${pct(pw)}</span>
            </div>
            <div class="frow">
              <span class="fn${bWin ? " win" : ""}">${esc(g.black)}</span>
              <span class="badge ${badgeClass(pb, pw)}">${pct(pb)}</span>
            </div>
          </div>`;
      });
      html += `</div>`;
    }

    // 2. 我们最有把握的预测（5行紧凑列表）
    if (!q && !state.tourId && flat.length >= 3) {
      const topConf = flat.slice().sort((a, b) => b.favP - a.favP).slice(0, 5);
      html += `<div class="sec-title">最有把握的预测</div><div class="conf-list">`;
      topConf.forEach((it) => {
        const g = it.game;
        const pr = g.prediction || {};
        const wFav = (pr.p_white_win || 0) >= (pr.p_black_win || 0);
        html += `
          <div class="conf-row" data-jump="${esc(it.key)}">
            <div class="conf-names">
              ${wFav ? `<b>${esc(g.white)}</b>` : esc(g.white)} – ${!wFav ? `<b>${esc(g.black)}</b>` : esc(g.black)}
            </div>
            <div class="conf-right">
              <span class="conf-meta">${esc(it.round.tour_name.split("|")[0].trim())} · ${esc(it.dt.full)}</span>
              <span class="badge ${it.favP >= 0.58 ? "hi" : "mid"}">${pct(it.favP)}</span>
            </div>
          </div>`;
      });
      html += `</div>`;
    }

    // 3. 按日期分组的赛程 / 赛果对阵列表
    const shown = flat.slice(0, state.limitShow);
    const byDay = new Map();
    shown.forEach((it) => {
      if (!byDay.has(it.dt.day)) byDay.set(it.dt.day, []);
      byDay.get(it.dt.day).push(it);
    });

    byDay.forEach((items, day) => {
      html += `<div class="day-div">${esc(day)}</div>`;
      items.forEach((it) => {
        const r = it.round;
        const g = it.game;
        const pr = g.prediction;
        const pw = pr ? pr.p_white_win : 0;
        const pd = pr ? pr.p_draw : 0;
        const pb = pr ? pr.p_black_win : 0;
        const done = isDone(g.status);
        const centerMain = done ? esc(g.status) : esc(it.dt.full);
        const open = state.openKey === it.key;
        const f = (pr && pr.factors) || {};

        html += `
          <div class="mcard" data-key="${esc(it.key)}" id="card-${esc(it.key)}">
            <div class="mtop">
              <span>${esc(r.tour_name)} · ${esc(r.round_name)}</span>
              <span>${esc(r.time_control)} ›</span>
            </div>
            <div class="mgrid">
              <div class="side">
                <div class="pname">
                  <span class="txt">${esc(g.white)}</span>
                  ${g.white_elo ? `<span class="elo-tag">#${g.white_elo}</span>` : ""}
                </div>
                <span class="badge ${badgeClass(pw, pb)}">${pct(pw)}</span>
              </div>
              <div class="center-box">
                <div class="main-val">${centerMain}</div>
              </div>
              <div class="side right">
                <div class="pname">
                  <span class="txt">${esc(g.black)}</span>
                  ${g.black_elo ? `<span class="elo-tag">#${g.black_elo}</span>` : ""}
                </div>
                <span class="badge ${badgeClass(pb, pw)}">${pct(pb)}</span>
              </div>
            </div>
            ${open && pr ? `
              <div class="mdetail">
                <div class="pbar-wrap">
                  <span>白 ${pct1(pw)}</span>
                  <div class="pbar">
                    <i class="pw" style="width:${(pw * 100).toFixed(1)}%"></i>
                    <i class="pd" style="width:${(pd * 100).toFixed(1)}%"></i>
                    <i class="pb" style="width:${(pb * 100).toFixed(1)}%"></i>
                  </div>
                  <span>黑 ${pct1(pb)}</span>
                </div>
                <div class="chips">
                  <span>和棋<b>${pct1(pd)}</b></span>
                  <span>预期<b>${num(pr.expected_score_white, 2)} : ${num(pr.expected_score_black, 2)}</b></span>
                  <span>Glicko-2<b>${num(f.white_glicko, 0)} / ${num(f.black_glicko, 0)}</b></span>
                  <span>近十局<b>${num(f.white_form_10, 2)} / ${num(f.black_form_10, 2)}</b></span>
                  <span>交手<b>${f.h2h_games != null ? f.h2h_games : 0}</b></span>
                </div>
              </div>` : ""}
          </div>`;
      });
    });

    if (flat.length > state.limitShow) {
      html += `<div class="more-wrap"><button class="more-btn" id="showMoreBtn">显示更多比赛</button></div>`;
    }

    el.main.innerHTML = html;

    el.main.querySelectorAll(".mcard").forEach((card) => {
      card.addEventListener("click", () => {
        const k = card.dataset.key;
        state.openKey = state.openKey === k ? null : k;
        renderMatchesView();
      });
    });
    el.main.querySelectorAll("[data-jump]").forEach((fc) => {
      fc.addEventListener("click", () => {
        const k = fc.dataset.jump;
        const idx = flat.findIndex((x) => x.key === k);
        if (idx >= state.limitShow) state.limitShow = idx + 10;
        state.openKey = k;
        renderMatchesView();
        const target = document.getElementById(`card-${k}`);
        if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    });
    const moreBtn = $("showMoreBtn");
    if (moreBtn) {
      moreBtn.addEventListener("click", () => {
        state.limitShow += 20;
        renderMatchesView();
      });
    }
  }

  function renderChampionshipView() {
    el.segWrap.style.display = "none";
    el.pillBar.className = "filter-pill-bar";
    el.pillBar.innerHTML = "";

    const champs = (state.data && state.data.championships) || [];
    if (!champs.length) {
      el.main.innerHTML = '<div class="empty">—</div>';
      return;
    }
    if (!state.champTourId || !champs.some((c) => c.tour_id === state.champTourId)) {
      state.champTourId = champs[0].tour_id;
    }
    const tour = champs.find((c) => c.tour_id === state.champTourId) || champs[0];

    let html = `<div class="tour-pills">`;
    champs.forEach((c) => {
      html += `<button class="${c.tour_id === tour.tour_id ? "on" : ""}" data-cid="${esc(c.tour_id)}">${esc(c.tour_name.split("|")[0].trim())}</button>`;
    });
    html += `</div>`;

    const tbStr = (tour.tiebreaks || []).join(" · ");
    const srcStr = tour.schedule_source === "official_chess_results" ? "官方赛程" : "FIDE编排";

    html += `
      <div class="sec-title">${esc(tour.tour_name)} · ${esc(tour.format)}</div>
      <div class="chips" style="margin-bottom:12px;">
        <span>轮次<b>${tour.rounds_played}/${tour.total_rounds}</b></span>
        <span>破同分<b>${esc(tbStr)}</b></span>
        <span>赛程<b>${srcStr}</b></span>
      </div>
      <div class="rr-card">
        <div class="rr-head">
          <span>#</span><span>棋手</span><span>等级分</span><span>积分</span><span>夺冠</span><span>前三</span><span>期望分</span>
        </div>`;

    (tour.standings || []).forEach((p, idx) => {
      const k = `rr::${idx}`;
      const open = state.openKey === k;
      const dist = p.rank_distribution || [];
      const maxV = Math.max.apply(null, dist.concat([0.0001]));

      html += `
        <div class="rr-row${open ? " sel" : ""}" data-rr="${esc(k)}">
          <span style="color:var(--muted)">${p.predicted_rank}</span>
          <span class="nm">${esc(p.name)}</span>
          <span style="color:var(--muted)">${p.elo}</span>
          <span>${num(p.current_points, 1)}</span>
          <span><span class="badge ${p.p_champion >= 0.4 ? "hi" : (p.p_champion >= 0.15 ? "mid" : "lo")}">${pct1(p.p_champion)}</span></span>
          <span style="color:var(--muted)">${pct1(p.p_top3)}</span>
          <span style="color:var(--muted)">${num(p.expected_points, 2)}</span>
        </div>`;

      if (open) {
        const cols = dist.map((v, i) => `
          <div class="col${i === 0 ? " hot" : ""}" title="${pct1(v)}">
            <div class="bar"><i style="height:${Math.max(2, (v / maxV) * 100).toFixed(1)}%"></i></div>
            <div class="k">${i + 1}</div>
          </div>`).join("");
        html += `
          <div class="rr-panel">
            <div class="chips">
              <span>已赛<b>${p.games_played}</b></span>
              <span>余局<b>${p.games_remaining}</b></span>
              <span>索伯分<b>${num(p.current_sb, 2)}</b></span>
              <span>期望名次<b>${num(p.expected_rank, 2)}</b></span>
            </div>
            <div class="dist">${cols}</div>
          </div>`;
      }
    });
    html += `</div>`;

    const upcoming = tour.upcoming_pairings || [];
    if (upcoming.length) {
      html += `<div class="sec-title">待赛对阵</div>`;
      upcoming.slice(0, 18).forEach((g) => {
        const pw = g.p_white_win || 0;
        const pb = g.p_black_win || 0;
        html += `
          <div class="mcard" style="cursor:default">
            <div class="mtop"><span>${esc(g.round_name)}</span><span>${esc(tour.time_control)}</span></div>
            <div class="mgrid">
              <div class="side">
                <div class="pname"><span class="txt">${esc(g.white)}</span></div>
                <span class="badge ${badgeClass(pw, pb)}">${pct(pw)}</span>
              </div>
              <div class="center-box"><div class="main-val">vs</div></div>
              <div class="side right">
                <div class="pname"><span class="txt">${esc(g.black)}</span></div>
                <span class="badge ${badgeClass(pb, pw)}">${pct(pb)}</span>
              </div>
            </div>
          </div>`;
      });
    }

    el.main.innerHTML = html;
    el.main.querySelectorAll("[data-cid]").forEach((b) => {
      b.addEventListener("click", () => {
        state.champTourId = b.dataset.cid;
        state.openKey = null;
        renderChampionshipView();
      });
    });
    el.main.querySelectorAll(".rr-row").forEach((row) => {
      row.addEventListener("click", () => {
        const k = row.dataset.rr;
        state.openKey = state.openKey === k ? null : k;
        renderChampionshipView();
      });
    });
  }

  function renderSidebar() {
    const d = state.data || {};
    const m = d.model || {};
    const sum = d.summary || {};
    const events = d.events || [];

    const confAcc = sum.confident_accuracy != null ? pct(sum.confident_accuracy) : "—";
    const allAcc = sum.accuracy != null ? pct(sum.accuracy) : "—";

    let html = `
      <div class="stat-pair">
        <div class="stat-box">
          <div class="lbl">高把握命中</div>
          <div class="big">${confAcc}</div>
          <div class="sub">${sum.confident_hits || 0}/${sum.confident_total || 0} · 全部 ${allAcc}</div>
        </div>
        <div class="stat-box">
          <div class="lbl">库内档案</div>
          <div class="big">${(m.n_games || 0).toLocaleString()}</div>
          <div class="sub">${(m.n_players || 0).toLocaleString()} 名棋手</div>
        </div>
      </div>`;

    const hits = sum.recent_hits || [];
    if (hits.length) {
      html += `<div class="side-block"><h3>命中的预测</h3>`;
      hits.slice(0, 4).forEach((h) => {
        html += `
          <div class="side-item">
            <div class="side-match">
              <span>${esc(h.white)}</span>
              <span>${esc(h.status)}</span>
              <span>${esc(h.black)}</span>
            </div>
            <div class="side-sub">
              <span>${esc(h.tour_name)}</span>
              <span>${esc(h.pick)} ${pct(h.prob)}</span>
            </div>
          </div>`;
      });
      html += `</div>`;
    }

    const misses = sum.recent_misses || [];
    if (misses.length) {
      html += `<div class="side-block"><h3>最有把握却失误的预测</h3>`;
      misses.slice(0, 3).forEach((ms) => {
        html += `
          <div class="side-item">
            <div class="side-match">
              <span>${esc(ms.white)}</span>
              <span>${esc(ms.status)}</span>
              <span>${esc(ms.black)}</span>
            </div>
            <div class="side-sub">
              <span>${esc(ms.tour_name)}</span>
              <span style="color:var(--red)">${esc(ms.pick)} ${pct(ms.prob)}</span>
            </div>
          </div>`;
      });
      html += `</div>`;
    }

    const tourSeen = new Map();
    events.filter((e) => e.status !== "finished").forEach((e) => {
      if (!tourSeen.has(e.tour_id)) tourSeen.set(e.tour_id, e);
    });
    if (tourSeen.size) {
      html += `<div class="side-card"><h3>赛季进行中的赛事</h3><div class="league-grid">`;
      tourSeen.forEach((ev, tid) => {
        const dt = fmtDateTime(ev.starts_at_ms, ev.starts_at);
        html += `
          <div class="league-item" data-tid="${esc(tid)}" data-tname="${esc(ev.tour_name)}">
            <span class="ln">${esc(ev.tour_name.split("|")[0].trim())}</span>
            <span class="ld">${esc(dt.day)}</span>
          </div>`;
      });
      html += `</div></div>`;
    }

    el.side.innerHTML = html;
    el.side.querySelectorAll(".league-item").forEach((lr) => {
      lr.addEventListener("click", () => {
        state.project = PROJECTS[0];
        state.subView = "schedule";
        state.tourId = lr.dataset.tid;
        state.tourName = lr.dataset.tname;
        state.limitShow = 30;
        el.viewSeg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.sub === "schedule"));
        renderTabs();
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  }

  function renderAll() {
    if (state.project.type === "championship") {
      renderChampionshipView();
    } else {
      renderMatchesView();
    }
    renderSidebar();
  }

  el.brand.addEventListener("click", () => {
    state.tourId = null;
    state.tourName = null;
    state.query = "";
    el.search.value = "";
    state.limitShow = 15;
    renderAll();
  });

  el.viewSeg.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (state.subView === btn.dataset.sub) return;
      state.subView = btn.dataset.sub;
      state.openKey = null;
      state.limitShow = 15;
      el.viewSeg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === btn));
      renderAll();
    });
  });

  el.searchBtn.addEventListener("click", () => {
    el.search.classList.toggle("open");
    if (el.search.classList.contains("open")) el.search.focus();
  });
  el.search.addEventListener("input", () => {
    state.query = el.search.value;
    if (state.project.type === "matches") renderMatchesView();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== el.search) {
      e.preventDefault();
      el.search.classList.add("open");
      el.search.focus();
    }
  });

  renderTabs();
  loadData().then(renderAll).catch(() => {
    el.main.innerHTML = '<div class="empty">—</div>';
  });
})();
</script>
</body>
</html>
