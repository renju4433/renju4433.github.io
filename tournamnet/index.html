<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>赛事预测</title>
<style>
  :root {
    --bg: #fbfbfa;
    --card: #ffffff;
    --line: #e9e9e6;
    --text: #17171a;
    --muted: #92929a;
    --accent: #1f6feb;
    --row: #fafaf8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  main { max-width: 760px; margin: 0 auto; padding: 28px 20px 64px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .tabs button {
    appearance: none; border: 1px solid var(--line); background: var(--card);
    color: var(--muted); font: inherit; font-size: 14px; padding: 7px 16px;
    border-radius: 999px; cursor: pointer; transition: .15s;
  }
  .tabs button.on { color: #fff; background: var(--accent); border-color: var(--accent); }

  .pickers { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  select {
    appearance: none; flex: 1 1 180px; min-width: 0;
    border: 1px solid var(--line);
    background: var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2392929a'/></svg>") no-repeat right 12px center;
    color: var(--text); font: inherit; font-size: 14px;
    padding: 9px 30px 9px 12px; border-radius: 9px; cursor: pointer;
    text-overflow: ellipsis;
  }
  select:focus { outline: none; border-color: var(--accent); }

  .mhead {
    display: grid; grid-template-columns: 56px minmax(0, 1fr) 92px;
    gap: 0 10px; color: var(--muted); font-size: 12px; padding: 0 12px 8px;
  }
  .mhead span:last-child { text-align: right; }

  #list { border-top: 1px solid var(--line); }

  .m {
    position: relative; display: grid;
    grid-template-columns: 56px minmax(0, 1fr) 92px;
    grid-template-rows: auto auto; gap: 2px 10px;
    padding: 10px 12px 12px; border-bottom: 1px solid var(--line);
    cursor: pointer; align-items: center;
  }
  .m:hover, .m.sel { background: var(--row); }
  .m .mt { grid-row: 1 / span 2; color: var(--muted); font-size: 12px; line-height: 1.35; }
  .m .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m .n.win { font-weight: 500; }
  .m .elo { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 400; }
  .m .p { text-align: right; font-size: 13px; color: var(--text); white-space: nowrap; }
  .m .p.dim { color: var(--muted); }
  .m .p.win { font-weight: 600; }
  .m .bar {
    position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    display: flex; pointer-events: none;
  }
  .m .bar span { display: block; height: 100%; transition: width .45s cubic-bezier(.2,.8,.2,1); }
  .m .bar .bw { background: var(--accent); opacity: .65; }
  .m .bar .bd { background: #d4d4d8; }
  .m .bar .bb { background: var(--text); opacity: .35; }

  .panel { border-bottom: 1px solid var(--line); background: #fff; padding: 4px 12px 18px; }
  .mp .probs { display: flex; align-items: center; gap: 10px; padding: 10px 0 14px; font-size: 13px; }
  .mp .probs b { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .mp .probs b.dim { color: var(--muted); font-weight: 500; }
  .mp .probs .track {
    flex: 1; height: 5px; border-radius: 3px; background: var(--line);
    display: flex; overflow: hidden;
  }
  .mp .probs .track i { display: block; height: 100%; }
  .mp .probs .track .tw { background: var(--accent); }
  .mp .probs .track .td { background: #d4d4d8; }
  .mp .probs .track .tb { background: var(--text); opacity: .55; }

  .mp .tbl { display: grid; gap: 1px; font-size: 13px; }
  .mp .tr {
    display: grid; grid-template-columns: minmax(90px, 1.4fr) 54px 66px 56px 54px 54px;
    gap: 8px 14px; padding: 5px 0; align-items: center;
  }
  .mp .tr span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp .tr span:nth-child(n+2) { text-align: right; }
  .mp .tr.h { color: var(--muted); font-size: 12px; }

  .empty { padding: 44px 0; color: var(--muted); font-size: 14px; text-align: center; }
  .spin { opacity: .45; transition: opacity .2s; }

  @media (max-width: 560px) {
    main { padding: 20px 14px 48px; }
    .mhead { grid-template-columns: 46px minmax(0, 1fr) 82px; padding: 0 10px 8px; font-size: 11px; }
    .m { grid-template-columns: 46px minmax(0, 1fr) 82px; padding: 9px 10px 11px; font-size: 14px; }
    .panel { padding: 4px 10px 16px; }
    .mp .tr { grid-template-columns: minmax(70px, 1.2fr) 44px 54px 46px 44px 44px; gap: 6px 8px; font-size: 12px; }
  }
</style>
</head>
<body>
<main>
  <nav class="tabs" id="projectTabs"></nav>

  <div class="pickers">
    <select id="event" aria-label="赛事"></select>
    <select id="round" aria-label="轮次"></select>
  </div>

  <div class="mhead" id="head">
    <span>时间</span><span>对阵</span><span>胜 / 和</span>
  </div>
  <div id="list"></div>
</main>

<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const chessDefaultApi = window.location.protocol.startsWith("http") && !window.location.hostname.endsWith("github.io")
    ? window.location.origin
    : "https://chess-prematch-api-production.up.railway.app";

  const $ = (id) => document.getElementById(id);
  const el = {
    tabs: $("projectTabs"),
    event: $("event"),
    round: $("round"),
    head: $("head"),
    list: $("list"),
  };

  const pct = (v) => (v == null ? "—" : (v * 100).toFixed(1) + "%");
  const num = (v, d = 2) => (v == null ? "—" : Number(v).toFixed(d));
  const hhmm = (s) => (s ? String(s).slice(11, 16) : "—");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  async function fetchJson(url, opts) {
    const res = await fetch(url, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.status);
    return data;
  }

  /* ---------------- 项目注册表（后续新增项目只需追加条目） ---------------- */
  const PROJECTS = [
    {
      id: "chess",
      label: "国际象棋",
      accent: "#1f6feb",
      apiBase: (qs.get("api") || chessDefaultApi).replace(/\/$/, ""),
      headHtml: "<span>时间</span><span>对阵</span><span>胜 / 和</span>",
      async fetchSchedule(proj) {
        const res = await fetchJson(`${proj.apiBase}/api/schedule?limit=16&with_pairings=true`);
        const raw = res.events || [];
        const byTour = new Map();
        raw.forEach((ev) => {
          const tid = ev.tour_id || ev.tour_name;
          if (!byTour.has(tid)) {
            byTour.set(tid, { id: tid, name: ev.tour_name, time_control: ev.time_control, rounds: [] });
          }
          byTour.get(tid).rounds.push(ev);
        });
        return [...byTour.values()];
      },
      async predictRound(proj, roundObj) {
        const pairings = roundObj.pairings || [];
        if (!pairings.length) return [];
        const res = await fetchJson(`${proj.apiBase}/api/predict-round`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            time_control: roundObj.time_control || "classical",
            pairings,
          }),
        });
        return res.predictions || [];
      },
    },
  ];

  let state = {
    project: PROJECTS.find((p) => p.id === qs.get("project")) || PROJECTS[0],
    tours: [],
    tour: null,
    round: null,
    preds: [],
    openIdx: null,
  };

  function fill(select, items, value) {
    select.innerHTML = "";
    items.forEach((it) => {
      const o = document.createElement("option");
      o.value = it.value;
      o.textContent = it.label;
      select.appendChild(o);
    });
    if (value != null) select.value = value;
  }

  function renderTabs() {
    el.tabs.innerHTML = "";
    PROJECTS.forEach((p) => {
      const b = document.createElement("button");
      b.textContent = p.label;
      b.className = p.id === state.project.id ? "on" : "";
      b.addEventListener("click", () => {
        if (state.project.id === p.id) return;
        state.project = p;
        renderTabs();
        activateProject();
      });
      el.tabs.appendChild(b);
    });
  }

  async function activateProject() {
    document.documentElement.style.setProperty("--accent", state.project.accent || "#1f6feb");
    el.head.innerHTML = state.project.headHtml;
    el.list.innerHTML = '<div class="empty spin">·</div>';
    try {
      state.tours = await state.project.fetchSchedule(state.project);
      if (!state.tours.length) {
        fill(el.event, [{ value: "", label: "—" }], "");
        fill(el.round, [{ value: "", label: "—" }], "");
        el.list.innerHTML = '<div class="empty">—</div>';
        return;
      }
      fill(el.event, state.tours.map((t) => ({ value: t.id, label: t.name })), state.tours[0].id);
      state.tour = state.tours[0];
      syncRounds();
    } catch {
      el.list.innerHTML = '<div class="empty">—</div>';
    }
  }

  function syncRounds() {
    const rounds = state.tour ? state.tour.rounds : [];
    if (!rounds.length) {
      state.round = null;
      fill(el.round, [{ value: "", label: "—" }], "");
      el.list.innerHTML = '<div class="empty">—</div>';
      return;
    }
    fill(
      el.round,
      rounds.map((r) => ({
        value: r.round_id,
        label: `${r.round_name}${r.starts_at ? " · " + r.starts_at.slice(5, 16) : ""}`,
      })),
      rounds[0].round_id
    );
    state.round = rounds[0];
    loadMatches();
  }

  async function loadMatches() {
    if (!state.round) return;
    state.openIdx = null;
    el.list.innerHTML = '<div class="empty spin">·</div>';
    el.list.classList.add("spin");
    try {
      state.preds = await state.project.predictRound(state.project, state.round);
      renderMatches();
    } catch {
      el.list.innerHTML = '<div class="empty">—</div>';
    } finally {
      el.list.classList.remove("spin");
    }
  }

  function renderMatches() {
    const pairings = (state.round && state.round.pairings) || [];
    const preds = state.preds || [];
    el.list.innerHTML = "";
    if (!pairings.length) {
      el.list.innerHTML = '<div class="empty">—</div>';
      return;
    }

    const timeLabel = hhmm(state.round.starts_at);
    const stTag = state.round.status === "ongoing" ? "进行中" : (state.round.status === "upcoming" ? "待开赛" : "已结束");

    pairings.forEach((g, idx) => {
      const pr = preds[idx];
      const pw = pr ? pr.p_white_win : 0;
      const pd = pr ? pr.p_draw : 0;
      const pb = pr ? pr.p_black_win : 0;
      const wFav = pw >= pb;

      const row = document.createElement("div");
      row.className = "m" + (state.openIdx === idx ? " sel" : "");
      row.innerHTML = `
        <div class="mt">${esc(timeLabel)}<br>${esc(stTag)}</div>
        <div class="n${wFav ? " win" : ""}">${esc(g.white)}${g.white_elo ? `<span class="elo">${g.white_elo}</span>` : ""}</div>
        <div class="p${wFav ? " win" : " dim"}">${pr ? pct(pw) : "—"} · ${pr ? pct(pd) : "—"}</div>
        <div class="n${!wFav ? " win" : ""}">${esc(g.black)}${g.black_elo ? `<span class="elo">${g.black_elo}</span>` : ""}</div>
        <div class="p${!wFav ? " win" : " dim"}">${pr ? pct(pb) : esc(g.status || "—")}</div>
        <div class="bar">
          <span class="bw" style="width:${(pw * 100).toFixed(1)}%"></span>
          <span class="bd" style="width:${(pd * 100).toFixed(1)}%"></span>
          <span class="bb" style="width:${(pb * 100).toFixed(1)}%"></span>
        </div>`;
      row.addEventListener("click", () => toggleMatch(idx, g, pr, row));
      el.list.appendChild(row);
    });
  }

  function toggleMatch(idx, g, pr, row) {
    const existing = el.list.querySelector(".panel");
    if (existing) existing.remove();
    el.list.querySelectorAll(".m.sel").forEach((r) => r.classList.remove("sel"));
    if (state.openIdx === idx) {
      state.openIdx = null;
      return;
    }
    state.openIdx = idx;
    row.classList.add("sel");
    if (!pr) return;

    const f = pr.factors || {};
    const panel = document.createElement("div");
    panel.className = "panel mp";
    panel.innerHTML = `
      <div class="probs">
        <b class="${pr.p_white_win >= pr.p_black_win ? "" : "dim"}">白 ${pct(pr.p_white_win)}</b>
        <b class="dim">和 ${pct(pr.p_draw)}</b>
        <div class="track">
          <i class="tw" style="width:${(pr.p_white_win * 100).toFixed(1)}%"></i>
          <i class="td" style="width:${(pr.p_draw * 100).toFixed(1)}%"></i>
          <i class="tb" style="width:${(pr.p_black_win * 100).toFixed(1)}%"></i>
        </div>
        <b class="${pr.p_black_win > pr.p_white_win ? "" : "dim"}">黑 ${pct(pr.p_black_win)}</b>
      </div>
      <div class="tbl">
        <div class="tr h"><span></span><span>等级分</span><span>Glicko-2</span><span>近10局</span><span>预期</span><span>交手</span></div>
        <div class="tr">
          <span>${esc(pr.white)}</span>
          <span>${num(pr.white_elo_used, 0)}</span>
          <span>${num(f.white_glicko, 0)}</span>
          <span>${num(f.white_form_10, 2)}</span>
          <span>${num(pr.expected_score_white, 2)}</span>
          <span>${f.h2h_games != null ? f.h2h_games : 0}</span>
        </div>
        <div class="tr">
          <span>${esc(pr.black)}</span>
          <span>${num(pr.black_elo_used, 0)}</span>
          <span>${num(f.black_glicko, 0)}</span>
          <span>${num(f.black_form_10, 2)}</span>
          <span>${num(pr.expected_score_black, 2)}</span>
          <span>—</span>
        </div>
      </div>`;
    row.insertAdjacentElement("afterend", panel);
  }

  el.event.addEventListener("change", () => {
    state.tour = state.tours.find((t) => t.id === el.event.value) || null;
    syncRounds();
  });
  el.round.addEventListener("change", () => {
    const rounds = (state.tour && state.tour.rounds) || [];
    state.round = rounds.find((r) => r.round_id === el.round.value) || null;
    loadMatches();
  });

  renderTabs();
  activateProject();
})();
</script>
</body>
</html>
